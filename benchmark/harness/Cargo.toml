[package]
name = "tsbench"
version = "0.1.0"
edition = "2021"
description = "Benchmark harness: converts TSBS data to CSV/Parquet and benchmarks SQLite engines (plain tables and the time-series extension)"
publish = false

[[bin]]
name = "tsbench"
path = "src/main.rs"

[features]
default = ["parquet"]
# Parquet output in `tsbench convert`. Disable with `--no-default-features` for a faster build.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rusqlite = { version = "0.41", features = ["bundled", "load_extension"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
parquet = { version = "60", optional = true, default-features = false, features = ["arrow", "zstd"] }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }

[profile.release]
lto = "thin"
debug = 1

# Standalone workspace, so a future workspace at the repository root does not pick this crate up by accident.
[workspace]
