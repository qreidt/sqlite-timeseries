[package]
name = "timeseries"
description = "SQLite loadable extension bringing TimescaleDB-style time-series storage to SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Output file: libtimeseries.so / libtimeseries.dylib / timeseries.dll.
# SQLite derives the entry point `sqlite3_timeseries_init` from that name (BD-02).
name = "timeseries"
# cdylib = shared library SQLite can `.load`; rlib = normal Rust library for the `static` build.
crate-type = ["cdylib", "rlib"]

[features]
default = ["loadable"]
# Build the loadable extension (.so/.dylib/.dll). SQLite is supplied by the host at load time.
loadable = ["rusqlite/loadable_extension"]
# Link the extension and a bundled SQLite into a Rust/C app instead (BD-03).
# Mutually exclusive with `loadable`: use `--no-default-features --features static`.
static = ["rusqlite/bundled"]

[dependencies]
# Decision 0003 (pending spike 5): rusqlite, with raw FFI via libsqlite3-sys for the gaps.
# Keep libsqlite3-sys on the version rusqlite itself uses (`cargo tree -p timeseries`).
rusqlite = { version = "0.41", default-features = false }
libsqlite3-sys = { version = "0.39", default-features = false }

[lints]
workspace = true
